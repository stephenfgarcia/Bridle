[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.99.1"
license = "UNLICENSED"
publish = false

# Every clippy lint at warn; tools/check.sh runs clippy with `-D warnings`, which makes them errors.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Public items must be documented (an error under `-D warnings`, as above).
[workspace.lints.rust]
missing_docs = "warn"
