# Bridle local services (card P0-02.2): Postgres, an S3 store (service `minio`, image RustFS: see
# docs/ops/local-dev.md), and mailpit. `pnpm dev` runs `docker compose up -d --wait`, then the
# profile-gated `minio-init` one-shot, then one check per service (tools/dev.sh). Every value comes from
# .env.example (committed dev defaults); compose never reads .env.local (docs/ops/secrets.md).
# Host ports: postgres 55432 (a Homebrew postgresql@16 holds 5432 on the development machine; the
# container port stays 5432), minio 9000 (S3 API) and 9001 (console), mailpit 1025 (SMTP) and 8025 (UI).
name: bridle

services:
  postgres:
    image: postgres:16.15-alpine
    env_file:
      - .env.example
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: initdb's temporary server listens on the unix socket only, so it never reads as ready
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  minio:
    image: rustfs/rustfs:1.0.4
    env_file:
      - .env.example
    environment:
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # One-shot behind a profile: `docker compose up --wait` would exit 1 on a service that exits 0
  # (docker/compose#10596), so tools/dev.sh runs it with `docker compose run --rm -T minio-init`.
  # It creates the S3_BUCKET bucket over the S3 API with curl's native SigV4 (no mc, no fourth image).
  minio-init:
    image: rustfs/rustfs:1.0.4
    profiles: [init]
    env_file:
      - .env.example
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        url="http://minio:9000/$$S3_BUCKET/"
        s3() {
          curl -sS -o /dev/null -w '%{http_code}' --aws-sigv4 "aws:amz:$$S3_REGION:s3" \
            --user "$$S3_ACCESS_KEY_ID:$$S3_SECRET_ACCESS_KEY" "$$@"
        }
        code="$$(s3 "$${url}?max-keys=0")"
        case "$$code" in
          200) echo "bucket $$S3_BUCKET: present" ;;
          404)
            code="$$(s3 -X PUT -H 'Content-Length: 0' "$$url")"
            [ "$$code" = 200 ] || { echo "bucket $$S3_BUCKET: PUT answered $$code" >&2; exit 1; }
            echo "bucket $$S3_BUCKET: created" ;;
          *) echo "bucket $$S3_BUCKET: GET answered $$code" >&2; exit 1 ;;
        esac

volumes:
  postgres-data:
  minio-data:
