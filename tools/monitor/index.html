<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridle Build Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  /* Layout: header strip / three scrolling panels (tasks, agents, logs) / timeline strip. */
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --line: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --accent: #2a78d6;
  --accent-soft: #cde2fb;
  --accent-ink: #1c5cab;
  --good: #0ca30c;
  --warn: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232322;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --line: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --accent: #3987e5;
    --accent-soft: #0d366b;
    --accent-ink: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #232322;
  --ink: #f0efec;
  --ink-2: #c3c2b7;
  --muted: #898781;
  --line: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --accent: #3987e5;
  --accent-soft: #0d366b;
  --accent-ink: #86b6ef;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.45 var(--font-ui);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  gap: 12px;
  padding: 12px 16px 16px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.04em; }
p { margin: 0; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--line); }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, .row:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
select, input[type="search"] { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 8px; min-width: 0; }
.mono { font-family: var(--font-mono); font-size: 12px; }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }
a { color: var(--accent-ink); }

/* Header strip */
.top {
  display: grid;
  grid-template-columns: minmax(220px, 1.2fr) minmax(240px, 1.4fr) auto auto;
  grid-template-areas: "brand overall tiles conn" "views views views views";
  gap: 10px 20px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
}
.brand { grid-area: brand; }
.brand .sub { color: var(--ink-2); font-size: 12px; }
.overall { grid-area: overall; display: grid; gap: 6px; }
.overall-text { display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: var(--ink-2); }
.overall-text strong { font-size: 22px; font-weight: 600; color: var(--ink); }
.tiles { grid-area: tiles; display: flex; gap: 8px; flex-wrap: wrap; }
.tile { display: grid; gap: 0; min-width: 72px; padding: 4px 10px; border-radius: var(--radius); background: var(--surface-2); border-left: 3px solid var(--c, var(--axis)); }
.tile .v { font-size: 20px; font-weight: 600; line-height: 1.1; }
.tile .l { font-size: 11px; color: var(--ink-2); }
.conn { grid-area: conn; display: flex; gap: 8px; align-items: center; justify-self: end; flex-wrap: wrap; }
.views { grid-area: views; display: flex; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
.views a { text-decoration: none; color: var(--ink-2); padding: 3px 10px; border-radius: 999px; }
.views a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); }
.views a:hover { color: var(--ink); }

/* Meter */
.meter { height: 6px; border-radius: 999px; background: var(--accent-soft); overflow: hidden; }
.meter .fill { display: block; height: 100%; width: 0; background: var(--c, var(--accent)); border-radius: 999px; transition: width 300ms ease; }
.meter.thin { height: 4px; }

/* Status pills */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: color-mix(in oklab, var(--c, var(--muted)) 14%, var(--surface)); color: var(--ink); }
.pill .ico { color: var(--c, var(--muted)); }
.ico { width: 12px; height: 12px; flex: none; }
.ico path, .ico circle { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.ico.solid circle { fill: currentColor; stroke: none; }
.s-running { --c: var(--accent); }
.s-done { --c: var(--good); }
.s-failed { --c: var(--critical); }
.s-blocked { --c: var(--serious); }
.s-stale { --c: var(--warn); }
.s-review { --c: var(--accent-ink); }
.s-queued, .s-planned { --c: var(--muted); }
.s-live { --c: var(--good); }
.s-cached, .s-waiting { --c: var(--warn); }
.s-offline { --c: var(--critical); }
.s-connecting { --c: var(--muted); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.s-running .ico.solid, .s-connecting .ico.solid { animation: pulse 1.6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .s-running .ico.solid, .s-connecting .ico.solid { animation: none; }
  .meter .fill { transition: none; }
}

/* Panels */
.grid { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr) minmax(320px, 460px); gap: 12px; min-height: 0; }
.panel { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.panel > header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel > header .spacer { flex: 1; }
.panel .scroll { overflow: auto; min-height: 0; padding: 8px 10px 12px; }
body[data-view="tasks"] .grid, body[data-view="agents"] .grid, body[data-view="logs"] .grid { grid-template-columns: minmax(0, 1fr); }
body[data-view="tasks"] .panel:not(.tasks), body[data-view="agents"] .panel:not(.agents), body[data-view="logs"] .panel:not(.logs) { display: none; }
.empty { color: var(--ink-2); padding: 18px 8px; max-width: 48ch; }
.empty code { font-family: var(--font-mono); font-size: 12px; }

/* Tasks */
.phase { margin: 4px 0 10px; }
.phase-head { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 6px 4px; }
.phase-head .pid { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); }
.phase-head .ptitle { font-weight: 600; }
.phase-head .pcount { font-size: 12px; color: var(--ink-2); }
.phase-head .meter { grid-column: 1 / -1; }
.row { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; border-radius: 0 var(--radius) var(--radius) 0; padding: 6px 8px 6px 6px; cursor: pointer; color: inherit; }
.row:hover { background: var(--surface-2); }
.row[aria-pressed="true"] { background: var(--accent-soft); }
.row.s-failed { border-left-color: var(--critical); }
.row.s-stale { border-left-color: var(--warn); }
.row.s-blocked { border-left-color: var(--serious); }
.row .tid { font-family: var(--font-mono); font-size: 12px; color: var(--ink-2); align-self: center; }
.row .ttitle { font-weight: 500; align-self: center; }
.row .tmeta { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); }
.row .tmeta .meter { flex: 1; }
.legend { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 6px 2px; border-top: 1px solid var(--line); margin-top: 8px; }

/* Agents */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.card { display: grid; gap: 6px; text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-left-width: 4px; border-radius: var(--radius); padding: 10px 12px; cursor: pointer; color: inherit; }
.card:hover { border-color: var(--axis); }
.card[aria-pressed="true"] { outline: 2px solid var(--accent); }
.card.s-stale { border-left-color: var(--warn); }
.card.s-failed { border-left-color: var(--critical); }
.card.s-done { border-left-color: var(--good); }
.card.s-running { border-left-color: var(--accent); }
.card .ctop { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.card .clabel { font-weight: 600; overflow-wrap: anywhere; }
.card .cid { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.card .cmsg { font-size: 12.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .cfoot { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); }
.card .cprog { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.card .cprog .meter { flex: 1; }

/* Logs */
.logs .controls { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; }
.logs .controls input[type="search"] { flex: 1; min-width: 120px; }
.logs .controls label { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--ink-2); }
.log { list-style: none; margin: 0; padding: 0; font-family: var(--font-mono); font-size: 12px; }
.log li { display: grid; grid-template-columns: 64px minmax(80px, 160px) 1fr; gap: 10px; padding: 3px 6px; border-left: 3px solid transparent; border-radius: 0 4px 4px 0; }
.log li:nth-child(even) { background: color-mix(in oklab, var(--surface-2) 60%, var(--surface)); }
.log li.lvl-warn { border-left-color: var(--warn); }
.log li.lvl-error { border-left-color: var(--critical); background: color-mix(in oklab, var(--critical) 8%, var(--surface)); }
.log li.t-done { border-left-color: var(--good); }
.log li.t-start { border-left-color: var(--accent); }
.log .lt { color: var(--muted); }
.log .la { color: var(--ink-2); overflow-wrap: anywhere; }
.log .lm { overflow-wrap: anywhere; white-space: pre-wrap; }
.log .tag { display: inline-block; font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); margin-right: 6px; vertical-align: 1px; }
.logs .scroll.dragging { outline: 2px dashed var(--accent); outline-offset: -6px; }
.logs .foot { font-size: 11.5px; color: var(--muted); padding: 6px 14px; border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: space-between; }
.panel.logs { grid-template-rows: auto minmax(0, 1fr) auto; }
.flash { font-size: 12px; color: var(--ink-2); }

/* Timeline */
.timeline { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.timeline > header { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.timeline > header .range { font-size: 12px; color: var(--ink-2); }
#tl-body { overflow: auto; max-height: 240px; padding: 6px 10px 10px; }
#tl-body svg { display: block; font-family: var(--font-mono); font-size: 11px; }
#tl-body .lbl { fill: var(--ink-2); }
#tl-body .tick { fill: var(--muted); }
#tl-body .gridline { stroke: var(--line); stroke-width: 1; }
#tl-body .axis { stroke: var(--axis); stroke-width: 1; }
#tl-body .bar { rx: 3; }
#tl-body .bar.s-running { fill: var(--accent); }
#tl-body .bar.s-done { fill: var(--good); }
#tl-body .bar.s-failed { fill: var(--critical); }
#tl-body .bar.s-stale { fill: var(--warn); }
#tl-body .now { stroke: var(--ink-2); stroke-dasharray: 2 3; }
.tooltip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px; font-size: 12px; max-width: 320px; }
.tooltip[hidden] { display: none; }

/* Factory */
.panel.factory { display: none; }
body[data-view="factory"] .grid { grid-template-columns: minmax(0, 1fr); }
body[data-view="factory"] .panel.factory { display: grid; }
.line-wrap { overflow-x: auto; padding-bottom: 6px; }
.line { display: grid; grid-template-columns: repeat(7, minmax(150px, 1fr)); gap: 8px; min-width: 1064px; }
.station { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); min-height: 150px; display: grid; grid-template-rows: auto 1fr; }
.station > header { padding: 8px 10px; border-bottom: 2px solid var(--line); display: grid; gap: 1px; }
.station.active > header { border-bottom-color: var(--accent); }
.station .sname { font-weight: 600; }
.station .sworker { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
.station .scount { font-size: 11px; color: var(--muted); }
.station .slot { padding: 8px; display: grid; gap: 8px; align-content: start; }
.fcard { display: grid; gap: 5px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--c, var(--axis)); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; color: inherit; font: inherit; }
.fcard:hover { border-color: var(--axis); border-left-color: var(--c, var(--axis)); }
.fcard[aria-pressed="true"] { outline: 2px solid var(--accent); }
.fcard .fid { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 6px; align-items: center; }
.fcard .ftitle { font-size: 12.5px; line-height: 1.3; }
.fcard .fagent { font-size: 11px; color: var(--accent-ink); overflow-wrap: anywhere; }
.fcard .fsince { font-size: 11px; color: var(--muted); }
.track { display: flex; align-items: center; }
.track .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--axis); flex: none; }
.track .dot.passed { background: var(--good); border-color: var(--good); }
.track .dot.current { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--accent); }
.track .dot.failed { background: var(--critical); border-color: var(--critical); }
.track .dot.blocked { background: var(--serious); border-color: var(--serious); }
.track .seg { flex: 1; height: 2px; background: var(--line); min-width: 6px; }
.track .seg.passed { background: var(--good); }
.fsec { display: grid; gap: 8px; margin-top: 14px; }
.fsec h3 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-2); }
.flow { display: flex; flex-wrap: wrap; gap: 6px 0; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); cursor: pointer; font: inherit; color: inherit; font-size: 12px; }
.chip .n { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.chip .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); flex: none; }
.chip.next { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip[aria-pressed="true"] { outline: 2px solid var(--accent); }
.chip.ph { background: none; border-style: dashed; }
.arrow { color: var(--axis); padding: 0 5px; font-size: 12px; }
.phase-sep { width: 100%; font-size: 11px; color: var(--muted); margin-top: 6px; font-family: var(--font-mono); }
.fdetail { display: grid; gap: 10px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.fdetail .dtitle { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.fdetail .track-lg { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.fdetail .st { display: grid; gap: 4px; justify-items: center; font-size: 11px; color: var(--ink-2); text-align: center; }
.fdetail .st .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--axis); }
.fdetail .st .dot.passed { background: var(--good); border-color: var(--good); }
.fdetail .st .dot.current { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 3.5px var(--accent); }
.fdetail .st .dot.failed { background: var(--critical); border-color: var(--critical); }
.fdetail .st .dot.blocked { background: var(--serious); border-color: var(--serious); }
.fdetail .st .when { font-family: var(--font-mono); color: var(--muted); }
.fdetail .hist { margin: 0; padding-left: 18px; font-size: 12px; display: grid; gap: 2px; }
.fdetail .hist .mono { color: var(--ink-2); }

/* Responsive */
@media (max-width: 1100px) {
  .top { grid-template-columns: 1fr auto; grid-template-areas: "brand conn" "overall overall" "tiles tiles" "views views"; }
  body[data-view="overview"] .grid { grid-template-columns: 1fr 1fr; }
  body[data-view="overview"] .panel.logs { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  body { height: auto; grid-template-rows: auto auto auto; }
  body[data-view="overview"] .grid { grid-template-columns: 1fr; }
  .panel .scroll { max-height: 60vh; }
  .top { grid-template-columns: 1fr; grid-template-areas: "brand" "overall" "tiles" "conn" "views"; }
  .fdetail .track-lg { grid-template-columns: repeat(4, 1fr); }
  .conn { justify-self: start; }
  .log li { grid-template-columns: 56px 1fr; }
  .log li .lm { grid-column: 1 / -1; }
}
</style>
</head>
<body data-view="overview">
<header class="top">
  <div class="brand">
    <h1>Bridle Build Monitor</h1>
    <p class="sub">Structural-engineering simulation LMS build: every agent, task, and log line, live.</p>
  </div>
  <div class="overall">
    <div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Tasks complete" id="overall-meter"><span class="fill" id="overall-fill"></span></div>
    <div class="overall-text"><strong id="overall-pct">0%</strong><span id="overall-count">0 of 0 tasks done</span><span id="overall-phase" class="muted"></span></div>
  </div>
  <div class="tiles" id="tiles" aria-label="Agent counters"></div>
  <div class="conn">
    <select id="run-select" aria-label="Run"><option value="all">All runs</option></select>
    <span class="pill s-connecting" id="conn-pill"></span>
    <span class="age muted tnum" id="last-age"></span>
  </div>
  <nav class="views" aria-label="Views">
    <a href="#overview">Overview</a>
    <a href="#tasks">Tasks</a>
    <a href="#agents">Agents</a>
    <a href="#logs">Logs</a>
    <a href="#factory">Factory</a>
  </nav>
</header>

<main class="grid">
  <section class="panel tasks" aria-labelledby="h-tasks">
    <header><h2 id="h-tasks">Tasks</h2><span class="muted" id="tasks-sub"></span><span class="spacer"></span><button type="button" id="clear-sel" hidden>Show all</button></header>
    <div class="scroll" id="tasks-body"></div>
  </section>
  <section class="panel agents" aria-labelledby="h-agents">
    <header><h2 id="h-agents">Agents</h2><span class="muted" id="agents-sub"></span></header>
    <div class="scroll" id="agents-body"></div>
  </section>
  <section class="panel logs" aria-labelledby="h-logs">
    <header>
      <h2 id="h-logs">Logs</h2><span class="muted" id="logs-sub"></span>
      <div class="controls">
        <select id="level-select" aria-label="Minimum level"><option value="debug">All levels</option><option value="info">Info and up</option><option value="warn">Warnings and up</option><option value="error">Errors only</option></select>
        <input type="search" id="search" placeholder="Search message, agent, task" aria-label="Search logs">
        <label><input type="checkbox" id="autoscroll" checked> Follow</label>
        <button type="button" id="copy-btn">Copy visible</button>
        <button type="button" id="load-btn">Load JSONL</button>
        <input type="file" id="file-input" accept=".jsonl,.json,.txt,.log" multiple hidden>
        <span class="flash" id="flash" aria-live="polite"></span>
      </div>
    </header>
    <div class="scroll" id="logs-body"><ol class="log" id="log-list"></ol></div>
    <div class="foot"><span id="logs-count"></span><span>Drop a .jsonl file from .bridle/progress here to view offline history.</span></div>
  </section>
  <section class="panel factory" aria-labelledby="h-factory">
    <header><h2 id="h-factory">Factory</h2><span class="muted" id="factory-sub"></span><span class="spacer"></span><span class="muted" id="factory-next"></span></header>
    <div class="scroll" id="factory-body"></div>
  </section>

/* ---------- Data sources ---------- */
function ingestEvent(raw, id, source) {
  var e = normEvent(raw, id, source);
  if (!e) return false;
  var prev = state.events.get(e.id);
  if (prev && prev.fromFile) e.fromFile = true;
  if (source === 'file') e.fromFile = true;
  state.events.set(e.id, e);
  return true;
}

function connectDb() {
  if (!(window.claude && typeof window.claude.use === 'function')) { setConn('offline', 'Not running inside claude.ai; load a JSONL file instead.'); return; }
  var timer = setTimeout(function () { if (state.conn === 'connecting') setConn('waiting', 'The store has not answered yet; data may be out of date.'); }, 10000);
  window.claude.use('db').then(function (db) {
    if (!db) { clearTimeout(timer); setConn('offline', 'Live data is not available in this view.'); return; }
    try {
      db.collection('tasks').onSnapshot(function (snap) {
        if (snap.empty) return;
        var m = new Map();
        snap.docs.forEach(function (doc) { var data = doc.data(); if (data && data.title) { var t = { id: doc.id }; Object.keys(data).forEach(function (k) { t[k] = data[k]; }); m.set(doc.id, t); } });
        if (m.size) { state.tasks = m; state.tasksFromDb = true; scheduleRender(); }
      }, function (err) { console.warn('tasks subscription ended', err && err.code); });
    } catch (e) { console.warn('tasks subscribe failed', e); }
    try {
      db.collection('events').orderBy('tsMs', 'desc').limit(EVENT_WINDOW).onSnapshot(function (snap) {
        clearTimeout(timer);
        snap.docChanges().forEach(function (ch) {
          if (ch.type === 'removed') {
            var cur = state.events.get(ch.doc.id);
            if (cur && cur.fromFile) { cur.source = 'file'; } else { state.events.delete(ch.doc.id); }
            return;
          }
          ingestEvent(ch.doc.data(), ch.doc.id, 'db');
        });
        setConn(snap.metadata && snap.metadata.fromCache ? 'cached' : 'live', snap.metadata && snap.metadata.fromCache ? 'Showing a cached copy; waiting for the store to confirm.' : 'Receiving events as they are written.');
      }, function (err) {
        clearTimeout(timer);
        setConn('offline', 'Store error: ' + ((err && err.code) || 'unknown') + '. Reload the page to reconnect.');
      });
    } catch (e) { clearTimeout(timer); setConn('offline', 'Could not subscribe to events.'); }
  }).catch(function () { clearTimeout(timer); setConn('offline', 'Live data is not available in this view.'); });
}

function loadFiles(files) {
  var added = 0, bad = 0, pending = files.length;
  if (!pending) return;
  Array.prototype.forEach.call(files, function (f) {
    var reader = new FileReader();
    reader.onload = function () {
      String(reader.result || '').split(/\r?\n/).forEach(function (line) {
        line = line.trim();
        if (!line) return;
        try {
          var obj = JSON.parse(line);
          if (obj && obj.op && obj.data) obj = obj.data;
          if (ingestEvent(obj, obj && obj.id, 'file')) added++; else bad++;
        } catch (e) { bad++; }
      });
      if (--pending === 0) { state.fileEvents += added; flash(added + ' events loaded' + (bad ? ', ' + bad + ' lines skipped' : '')); scheduleRender(); }
    };
    reader.onerror = function () { bad++; if (--pending === 0) { flash('Could not read the file'); scheduleRender(); } };
    reader.readAsText(f);
  });
}

var flashTimer = null;
function flash(msg) {
  els.flash.textContent = msg;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function () { els.flash.textContent = ''; }, 4000);

  var drop = els['logs-body'];
  ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('dragging'); }); });
  ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('dragging'); }); });
  drop.addEventListener('drop', function (e) { if (e.dataTransfer && e.dataTransfer.files) loadFiles(e.dataTransfer.files); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (state.selectedTask || state.selectedAgent)) { state.selectedTask = null; state.selectedAgent = null; scheduleRender(); } });
  window.addEventListener('resize', scheduleRender);
  setInterval(scheduleRender, 30000);
  render();
  connectDb();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
